<!DOCTYPE html>
<html lang="en" data-theme="day" data-fit="native">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>KD Command Center</title>
  <link rel="stylesheet" href="/command/static/command.css?v=kdcc47" />
  <link rel="icon" href="/static/logo.png" />
</head>
<body>
  <div id="loginGate" class="login-gate">
    <div class="login-card glass">
      <img class="login-logo" src="/static/logo.png" alt="KDFINSCHOOL" />
      <h1>KD Command Center</h1>
      <p class="muted">10-instance fleet monitor</p>
      <form id="loginForm">
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required />
        <button class="btn primary" type="submit">Enter</button>
      </form>
      <p id="loginErr" class="err" hidden></p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <header class="top glass">
      <div class="brand">
        <img class="logo-main" src="/static/logo.png" alt="KDFINSCHOOL" />
        <div class="brand-title">
          <h1>KD COMMAND CENTER</h1>
          <div class="bar"></div>
        </div>
      </div>
      <div class="header-mid">
        <div class="total-pnl-box glass-lite" id="totalPnlBox" title="Day PnL from desks with non-zero Day PnL">
          <div class="total-pnl-label">Total Running PNL</div>
          <div class="total-pnl" id="totalPnl">—</div>
          <div class="total-pnl-count" id="totalPnlCount">from 0 servers</div>
        </div>
        <div class="br-pnl-box glass-lite" id="brPnlBox" title="Booked + Running after Refresh Total PNL">
          <div class="total-pnl-split-row">
            <span>Booked</span>
            <b id="totalBooked" class="total-pnl-sub">—</b>
          </div>
          <div class="total-pnl-split-row">
            <span>Running</span>
            <b id="totalRunning" class="total-pnl-sub">—</b>
          </div>
          <div class="total-pnl-split-row">
            <span>Total</span>
            <b id="totalSplitSum" class="total-pnl-sub">—</b>
          </div>
          <div class="total-pnl-count" id="totalSplitCount">from 0 servers</div>
        </div>
        <div class="time-box glass-lite" title="IST time">
          <div class="clock" id="clock">--:--:--</div>
          <div class="clock-sub" id="clockDate">IST</div>
        </div>
      </div>
      <div class="header-right">
        <div class="theme-toggle icon-toggle" id="themeToggle" role="group" aria-label="Day night">
          <button type="button" data-theme="day" class="on" title="Day mode" aria-label="Day">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
          </button>
          <button type="button" data-theme="night" title="Night mode" aria-label="Night">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
          </button>
        </div>
        <button type="button" class="btn logout" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="main">
      <div class="meta-row">
        <button type="button" class="btn small cc-action cc-broadcast broadcast-left" id="broadcastBtn" title="Send text/file to all Kavach ALERT LOGS">Broadcast</button>
        <div class="meta-actions">
          <button type="button" class="btn small cc-action cc-pnl-refresh" id="pnlSplitAllBtn" title="Load Booked + Running PnL for all UP desks">Refresh Total PNL</button>
          <button type="button" class="btn small cc-action cc-desk-refresh" id="refreshBtn" title="Refresh desk snapshot (health, Day PnL)">Desk Refresh</button>
        </div>
        <div class="meta-status">
          <span id="liveLabel">0 live · 15 slots</span>
          <span id="updatedAt">—</span>
        </div>
      </div>
      <div class="instance-scroll" id="instanceScroll">
        <div class="instance-grid" id="instanceGrid"></div>
      </div>
    </main>
  </div>

  <div id="broadcastModal" class="cc-modal" hidden>
    <div class="cc-modal-card glass">
      <header class="cc-modal-head">
        <h2>Broadcast Message</h2>
        <button type="button" class="btn small logout" id="broadcastClose" aria-label="Close">Close</button>
      </header>
      <label class="cc-field">
        <span>Message</span>
        <textarea id="broadcastText" rows="6" maxlength="2000" placeholder="Type the notice…"></textarea>
      </label>
      <div class="cc-field">
        <span>Send to desks</span>
        <div class="cc-desk-pick-bar">
          <button type="button" class="btn tiny cc-action cc-desk-refresh" id="broadcastSelectAll">Select all</button>
          <button type="button" class="btn tiny cc-action cc-card-refresh" id="broadcastSelectNone">Select none</button>
          <span class="cc-desk-pick-count" id="broadcastDeskCount">0 selected</span>
        </div>
        <div class="cc-desk-pick" id="broadcastDeskList"></div>
      </div>
      <div class="cc-field-row">
        <label class="cc-field">
          <span>Severity</span>
          <select id="broadcastSeverity">
            <option value="orange" selected>Orange</option>
            <option value="green">Green</option>
            <option value="red">Red (sound)</option>
          </select>
        </label>
        <label class="cc-field grow">
          <span>Attach file (Optional Image/Text/PDF max 1 MB)</span>
          <input id="broadcastFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,text/plain,text/markdown,application/pdf,.png,.jpg,.jpeg,.webp,.gif,.txt,.md,.pdf" />
        </label>
      </div>
      <div class="cc-modal-actions">
        <button type="button" class="btn primary" id="broadcastSend">Send</button>
      </div>
      <pre id="broadcastResult" class="cc-broadcast-result" hidden></pre>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/command/static/command.js?v=kdcc47"></script>
</body>
</html>
